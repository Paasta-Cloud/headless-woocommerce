name: Check storefront

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: php tests/design-schema.php
      - run: php tests/manage-permissions.php
      - run: php tests/commerce.php
      - run: php tests/content.php
      - run: php tests/checkout-customer.php
      - run: php tests/customer-profile.php
      - run: php -l wordpress/mu-plugins/khanechin-account.php
      - run: php tests/order-currency.php
      - run: php tests/return-plugin.php
      - run: php tests/public-cache.php
      - run: php tests/connector.php
      - run: php -l wordpress/plugins/paasta-headless-connector/paasta-headless-connector.php
      - run: find wordpress/plugins/paasta-headless-builder -name '*.php' -exec php -l {} \;
      - run: npm run build
      - run: node scripts/package-connector.mjs
      - run: git diff --check
      - run: cd wordpress/plugins && zip -r ../../paasta-headless-builder.zip paasta-headless-builder
      - uses: actions/upload-artifact@v4
        with:
          name: paasta-headless-builder
          path: paasta-headless-builder.zip
      - uses: actions/upload-artifact@v4
        with:
          name: paasta-headless-connector
          path: public/downloads/paasta-headless-connector.zip

  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/paasta-cloud/headless-woocommerce:${{ github.sha }}
            ghcr.io/paasta-cloud/headless-woocommerce:latest
